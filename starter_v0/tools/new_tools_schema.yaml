- name: github_search
  description: Search for open-source repositories on GitHub by query string. Use this when the user asks for code repositories, libraries, or open-source projects.
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Search keywords for repositories.
      sort:
        type: string
        description: Sort field (stars, forks, updated). Default is stars.
        enum: [stars, forks, updated]
      limit:
        type: integer
        description: Maximum number of results (default 5, max 10).
    required:
      - query

- name: hackernews
  description: Search tech discussions, stories, and comments on Hacker News via Algolia API. Use this for tech trends and startup discussions.
  parameters:
    type: object
    properties:
      query:
        type: string
        description: Keyword to search on Hacker News.
      limit:
        type: integer
        description: Maximum number of stories (default 5, max 10).
    required:
      - query

- name: wikipedia
  description: Look up summary definitions and explanations of concepts or entities on Wikipedia. Use this for general knowledge lookup.
  parameters:
    type: object
    properties:
      title:
        type: string
        description: The article title or concept to look up.
    required:
      - title

- name: save_note
  description: Save a research summary or markdown note to a local file. ONLY execute when confirmed is true.
  parameters:
    type: object
    properties:
      filename:
        type: string
        description: Name of the file to save.
      content:
        type: string
        description: Markdown text content to save.
      confirmed:
        type: boolean
        description: Must be set to true after explicit user confirmation.
    required:
      - filename
      - content
      - confirmed